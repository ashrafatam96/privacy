<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policies</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.7; color: #1f2430; background: #f4f5f7;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 64px; }
  header { border-bottom: 3px solid #f59e0b; padding-bottom: 16px; margin-bottom: 24px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .muted { color: #6b7280; font-size: 14px; }
  a.app {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: 1px solid #e3e6eb; border-radius: 12px;
    padding: 16px 20px; margin: 10px 0; text-decoration: none; color: #14161a;
  }
  a.app:hover { border-color: #f59e0b; }
  a.app .name { font-weight: 600; }
  a.app .arrow { color: #b45309; }
  footer { margin-top: 32px; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Privacy Policies</h1>
      <div class="muted">Privacy policies for apps by Ashraf</div>
    </header>

    <a class="app" href="concrete-calculator/">
      <span class="name">Concrete Calculator</span>
      <span class="arrow">View policy &rarr;</span>
    </a>

    <!-- Add future apps here, e.g.:
    <a class="app" href="another-app/">
      <span class="name">Another App</span>
      <span class="arrow">View policy &rarr;</span>
    </a>
    -->

    <footer>&copy; 2026 Ashraf. All rights reserved.</footer>
  </div>
</body>
</html>
